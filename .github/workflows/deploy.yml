name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        run: npm run build:hostinger

      - name: Create ZIP
        run: |
          cd dist
          zip -r ../deploy.zip .
          cd ..
          echo "ZIP size: $(du -sh deploy.zip | cut -f1)"

      - name: Deploy via webhook
        run: |
          HTTP_CODE=$(curl -s -o /tmp/deploy_response.txt -w "%{http_code}" \
            -X POST \
            -H "X-Deploy-Token: ${{ secrets.WEBHOOK_SECRET }}" \
            -F "zip=@deploy.zip" \
            "https://emmagination.cl/deploy-webhook.php")
          cat /tmp/deploy_response.txt
          echo "HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Deploy failed with HTTP $HTTP_CODE"
            exit 1
          fi
